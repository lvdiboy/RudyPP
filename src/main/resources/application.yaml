server:
  port: 9333
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        # Expose only the health endpoint: /api/actuator/health
        include: health
  endpoint:
    health:
      # Report UP/DOWN only; component details (DB, Redis) stay hidden from anonymous callers
      show-details: never
      # Adds /api/actuator/health/liveness and /api/actuator/health/readiness
      probes:
        enabled: true
spring:
  datasource:
    # Every connection setting can be overridden with environment variables; the defaults are for local development only (local MySQL)
    # On EC2, enable the prod profile (see application-prod.yaml), which takes all connection settings from environment variables
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rudypp}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USERNAME:rudypp}
    password: ${DB_PASSWORD:rudypp}
    hikari:
      pool-name: rudypp-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      # Hikari timeouts are in milliseconds
      connection-timeout: 30000
      # 30 minutes; must be shorter than MySQL's wait_timeout (8 hours by default) so the pool never hands out a connection the server has closed
      max-lifetime: 1800000
  jpa:
    hibernate:
      # Creates tables and adds columns from the entities; switch to validate in production once a migration tool such as Flyway is in place
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        # Read and write times in UTC (audit fields createdAt / updatedAt)
        jdbc:
          time_zone: UTC
    show-sql: true
  data:
    # In Spring Boot 3.x the Redis prefix is spring.data.redis (the old spring.redis no longer works)
    redis:
      host: 127.0.0.1
      port: 6379
      # password:  no password by default; always set one in production
      # Connection timeout
      timeout: 10s
      # Redis has 16 databases by default; this picks which one to use (default 0)
      database: 0
      # Spring Boot uses the Lettuce client by default; pooling needs commons-pool2
      lettuce:
        pool:
          enabled: true
          # Maximum connections in the pool (negative = no limit), default 8
          max-active: 10
          # Maximum time to wait for a connection (negative = no limit), default -1
          max-wait: -1ms
          # Maximum idle connections in the pool, default 8
          max-idle: 8
          # Minimum idle connections in the pool, default 0
          min-idle: 0
