<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JWT 首页</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>

<!-- 已登录 -->
<div class="card wide hidden" id="homeCard">
    <h1 id="welcome">欢迎</h1>
    <div class="chips" id="roles"></div>
    <p class="meta" id="expiry"></p>

    <label for="tokenBox">当前 Token（请求时放在 Authorization 请求头中）</label>
    <textarea id="tokenBox" readonly></textarea>

    <div class="actions">
        <button class="secondary" id="loadUsersBtn">查看用户列表</button>
        <button class="secondary" id="logoutBtn">退出登录</button>
    </div>

    <div id="homeMessage" class="message"></div>

    <table id="userTable" class="hidden">
        <thead><tr><th>用户名</th><th>姓名</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script src="js/common.js"></script>
<script>
    const currentToken = storage('get');
    const claims = validClaims(currentToken);

    function showHome() {
        $('welcome').textContent = '欢迎，' + claims.sub;
        (claims.rol || '').split(',').filter(Boolean).forEach(role => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = role.replace(/^ROLE_/, '');
            $('roles').appendChild(chip);
        });
        $('expiry').textContent = 'Token 过期时间：' + new Date(claims.exp * 1000).toLocaleString();
        $('tokenBox').value = currentToken;
        $('homeCard').classList.remove('hidden');
    }

    $('loadUsersBtn').addEventListener('click', async () => {
        clearMessage($('homeMessage'));
        try {
            const res = await fetch(API + '/users?pageNum=0&pageSize=20', {
                headers: {'Authorization': currentToken}
            });
            if (res.status === 401) {
                goToLogin('invalid');
                return;
            }
            if (!res.ok) {
                showMessage($('homeMessage'), await readError(res, '获取用户列表失败'), 'error');
                return;
            }
            const page = await res.json();
            const tbody = $('userTable').querySelector('tbody');
            tbody.innerHTML = '';
            (page.content || []).forEach(user => {
                const tr = document.createElement('tr');
                [user.userName, user.fullName].forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = value;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            $('userTable').classList.remove('hidden');
        } catch (err) {
            showMessage($('homeMessage'), '无法连接服务器：' + err.message, 'error');
        }
    });

    $('logoutBtn').addEventListener('click', async () => {
        try {
            await fetch(API + '/auth/logout', {method: 'POST', headers: {'Authorization': currentToken}});
        } catch (err) {
            // 服务器不可用时也清除本地登录状态
        }
        goToLogin('logout');
    });

    // 未登录或 Token 已过期时直接回到登录页
    if (claims) {
        showHome();
    } else {
        goToLogin(currentToken ? 'expired' : null);
    }
</script>
</body>
</html>
