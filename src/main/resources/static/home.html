<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JWT Home</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>

<!-- Logged in -->
<div class="card wide hidden" id="homeCard">
    <h1 id="welcome">Welcome</h1>
    <div class="chips" id="roles"></div>
    <p class="meta" id="expiry"></p>

    <label for="tokenBox">Current token (send it in the Authorization request header)</label>
    <textarea id="tokenBox" readonly></textarea>

    <div class="actions">
        <button class="secondary" id="loadUsersBtn">Show users</button>
        <button class="secondary" id="logoutBtn">Log out</button>
    </div>

    <div id="homeMessage" class="message"></div>

    <table id="userTable" class="hidden">
        <thead><tr><th>User name</th><th>Full name</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script src="js/common.js"></script>
<script>
    const currentToken = storage('get');
    const claims = validClaims(currentToken);

    function showHome() {
        $('welcome').textContent = 'Welcome, ' + claims.sub;
        (claims.rol || '').split(',').filter(Boolean).forEach(role => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = role.replace(/^ROLE_/, '');
            $('roles').appendChild(chip);
        });
        $('expiry').textContent = 'Token expires: ' + new Date(claims.exp * 1000).toLocaleString();
        $('tokenBox').value = currentToken;
        $('homeCard').classList.remove('hidden');
    }

    $('loadUsersBtn').addEventListener('click', async () => {
        clearMessage($('homeMessage'));
        try {
            const res = await fetch(API + '/users?pageNum=0&pageSize=20', {
                headers: {'Authorization': currentToken}
            });
            if (res.status === 401) {
                goToLogin('invalid');
                return;
            }
            if (!res.ok) {
                showMessage($('homeMessage'), await readError(res, 'Failed to load users'), 'error');
                return;
            }
            const page = await res.json();
            const tbody = $('userTable').querySelector('tbody');
            tbody.innerHTML = '';
            (page.content || []).forEach(user => {
                const tr = document.createElement('tr');
                [user.userName, user.fullName].forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = value;
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            $('userTable').classList.remove('hidden');
        } catch (err) {
            showMessage($('homeMessage'), 'Cannot reach the server: ' + err.message, 'error');
        }
    });

    $('logoutBtn').addEventListener('click', async () => {
        try {
            await fetch(API + '/auth/logout', {method: 'POST', headers: {'Authorization': currentToken}});
        } catch (err) {
            // Clear the local login state even if the server is unavailable
        }
        goToLogin('logout');
    });

    // Not logged in or token expired: go back to the login page
    if (claims) {
        showHome();
    } else {
        goToLogin(currentToken ? 'expired' : null);
    }
</script>
</body>
</html>
