<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JWT Login</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>

<!-- Not logged in: log in / sign up -->
<div class="card" id="authCard">
    <h1>Spring Security JWT Demo</h1>
    <p class="subtitle">JWT login and sign-up demo AutoDeploy Test</p>

    <div class="tabs">
        <button class="tab active" data-tab="login">Log in</button>
        <button class="tab" data-tab="register">Sign up</button>
    </div>

    <form id="loginForm">
        <label for="loginUsername">User name</label>
        <input type="text" id="loginUsername" autocomplete="username" required>
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
        <label class="checkbox"><input type="checkbox" id="rememberMe"> Remember me (7 days; otherwise 1 hour)</label>
        <button type="submit" class="primary">Log in</button>
        <p class="tip">Default admin account: root / root</p>
    </form>

    <form id="registerForm" class="hidden">
        <label for="regUsername">User name</label>
        <input type="text" id="regUsername" autocomplete="username" required>
        <label for="regFullName">Full name</label>
        <input type="text" id="regFullName" required>
        <div class="hint">2-15 letters, digits or Chinese characters; cannot be all digits</div>
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" autocomplete="new-password" required>
        <button type="submit" class="primary">Sign up</button>
        <p class="tip">New users get the USER and MANAGER roles</p>
    </form>

    <div id="authMessage" class="message"></div>
</div>

<script src="js/common.js"></script>
<script>
    function switchTab(name) {
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
        $('loginForm').classList.toggle('hidden', name !== 'login');
        $('registerForm').classList.toggle('hidden', name !== 'register');
        clearMessage($('authMessage'));
    }

    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));

    $('loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = e.submitter;
        btn.disabled = true;
        clearMessage($('authMessage'));
        try {
            const res = await fetch(API + '/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: $('loginUsername').value.trim(),
                    password: $('loginPassword').value,
                    rememberMe: $('rememberMe').checked
                })
            });
            if (!res.ok) {
                showMessage($('authMessage'), await readError(res, 'Login failed'), 'error');
                return;
            }
            storage('set', res.headers.get('Authorization'));
            // Go to the page the server returned for after login
            const body = await res.json();
            location.replace(body.redirect);
        } catch (err) {
            showMessage($('authMessage'), 'Cannot reach the server: ' + err.message, 'error');
        } finally {
            btn.disabled = false;
        }
    });

    $('registerForm').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = e.submitter;
        btn.disabled = true;
        clearMessage($('authMessage'));
        const userName = $('regUsername').value.trim();
        try {
            const res = await fetch(API + '/users/sign-up', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    userName: userName,
                    fullName: $('regFullName').value.trim(),
                    password: $('regPassword').value
                })
            });
            if (!res.ok) {
                showMessage($('authMessage'), await readError(res, 'Sign-up failed'), 'error');
                return;
            }
            $('registerForm').reset();
            switchTab('login');
            $('loginUsername').value = userName;
            $('loginPassword').focus();
            showMessage($('authMessage'), 'Signed up, please log in', 'success');
        } catch (err) {
            showMessage($('authMessage'), 'Cannot reach the server: ' + err.message, 'error');
        } finally {
            btn.disabled = false;
        }
    });

    // Already logged in: go straight to the home page; when sent back from it, show the matching message
    if (validClaims(storage('get'))) {
        location.replace(API + '/home.html');
    } else {
        const message = LOGIN_MESSAGES[new URLSearchParams(location.search).get('msg')];
        if (message) showMessage($('authMessage'), message[0], message[1]);
    }
</script>
</body>
</html>
