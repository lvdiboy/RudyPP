# Loaded together with src/main/resources/application.yaml; only overrides what the tests need
# Tests use an in-memory H2 database (MySQL mode), so MySQL doesn't need to be installed
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:rudypp-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# Run data.sql after Hibernate creates the tables, to insert the roles and the root account
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
# Tests use an in-memory fake instead of Redis (see InMemoryRedisTestConfiguration), so Redis doesn't need to be installed either
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
# The fake connection factory can't answer a health check; the database check still runs
management.health.redis.enabled=false
